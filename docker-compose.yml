# All three packages share ONE compose project, keeping `docker compose ps` and
# `logs` consistent. Discovery does not rely on the project name or on
# container_name: the network alias below pins the hostname `kage-frontend`.
name: kage

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: ${BACKEND_HOST:-kage-backend}
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    image: kage-frontend:local
    # No container_name: pinning it makes `up --build` fail with
    # "container name is already in use" once a stale exited container holds it.
    restart: unless-stopped
    init: true
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-kage-backend}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    ports:
       - "${FRONTEND_PORT:-5173}:5173"
    networks:
      kage-network:
        # Explicit alias: on an external network Compose does not add the
        # service-name alias, so `http://kage-frontend:5173` would not resolve.
        aliases:
          - kage-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  kage-network:
    external: true
    name: ${KAGE_DOCKER_NETWORK:-kage-network}
